[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gedanken-engine-for-regret-minimization"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.4", "pyyaml>=6.0.3", "rich>=15.0.0"]

[project.scripts]
rc = "src.replay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "types-PyYAML>=6.0.12.20260518",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
