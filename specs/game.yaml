game:
  name: minimal_falsifier
  actions: [GO, WAIT]
  agents: [A, B]
  turn_limit: 1
  ground_truth: DANGER # can be SAFE or DANGER
  private_signals:
    A: SAFE
    B: DANGER
  externality_cost:
    crash: 10.0
    wait: 1.0
rules:
  - if: { action: GO, ground_truth: DANGER }
    then: { outcome: CRASH, cost: crash }
  - if: { action: GO, ground_truth: SAFE }
    then: { outcome: SUCCESS, cost: 0.0 }
  - if: { action: WAIT }
    then: { outcome: STALEMATE, cost: wait }
