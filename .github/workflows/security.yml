name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdb41dee6f188f7c3366757a8dab4d006f37cf64
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@cdb41dee6f188f7c3366757a8dab4d006f37cf64

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run dependency audit
        run: uv run make security-audit

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --dev
      - name: Generate SBOM
        run: uv run make sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cyclonedx-sbom
          path: runs/security/sbom.cdx.json
          if-no-files-found: error

  attest:
    name: attest
    runs-on: ubuntu-latest
    needs:
      - sbom
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --dev
      - name: Generate SBOM for attestation subject
        run: uv run make sbom
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@d8d4d3fda60cd25f7de5fef3157215f40ed8e8d5
        with:
          subject-path: runs/security/sbom.cdx.json
